<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tick Tack Toe</title>
{% load static %}
<link rel="icon" type="image/svg+xml" href="{% static 'favicon.svg' %}">
<link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
<div class="game-container">
  <div class="controls" aria-label="Configuración de partida">
    <label>
      Modo
      <select id="modeSelect" aria-label="Modo de juego">
        <option value="pvp">Jugador vs Jugador</option>
        <option value="ai">Jugador vs IA</option>
      </select>
    </label>

    <label>
      Dificultad IA
      <select id="difficultySelect" aria-label="Dificultad IA">
        <option value="1">Nivel 1 · Muy Fácil</option>
        <option value="2">Nivel 2 · Fácil</option>
        <option value="3">Nivel 3 · Intermedio</option>
        <option value="4">Nivel 4 · Difícil</option>
        <option value="5">Nivel 5 · Experto</option>
      </select>
    </label>

    <label>
      Primer turno
      <select id="starterSelect" aria-label="Jugador que empieza">
        <option value="X">Empieza X</option>
        <option value="O">Empieza O</option>
      </select>
    </label>

    <label>
      Tema visual
      <select id="themeSelect" aria-label="Tema visual">
        <option value="dark">Modo oscuro</option>
        <option value="light">Modo claro</option>
      </select>
    </label>
  </div>

  <section class="scoreboard" aria-label="Marcador de partidas">
    <div class="score-card score-x"><span>Jugador X</span><strong id="scoreX">0</strong></div>
    <div class="score-card"><span>Empates</span><strong id="scoreDraw">0</strong></div>
    <div class="score-card score-o"><span>Jugador O / IA</span><strong id="scoreO">0</strong></div>
  </section>

  <p id="status" class="status" aria-live="polite"></p>
  <div id="board" role="grid" aria-label="Tablero de Tick Tack Toe"></div>

  <div class="actions">
    <button id="undoBtn" type="button">Deshacer jugada</button>
    <button id="restartBtn" type="button">Reiniciar partida</button>
    <button id="resetScoreBtn" type="button">Borrar marcador</button>
  </div>
  <footer class="footer-copy">
    <span class="text-cyber-gold">©</span> <span id="currentYear"></span> Todos los derechos reservados • Built with Python & Django • UX/UI Interface • Deployed on Render ®
  </footer>

</div>

<script src="{% static 'js/game.js' %}"></script>
<script>
  document.getElementById("currentYear").textContent = new Date().getFullYear();
</script>
</body>
</html>
